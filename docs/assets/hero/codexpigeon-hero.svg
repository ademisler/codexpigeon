<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="520"
  viewBox="0 0 1600 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">CodexPigeon</title>
  <desc id="desc">Non-interrupting mailbox companion for Codex worktrees.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#202020" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#373634" />
      <stop offset="100%" stop-color="#262523" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ffd2ad" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow
        dx="0"
        dy="26"
        stdDeviation="26"
        flood-color="#000000"
        flood-opacity="0.32"
      />
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)" />
  <rect
    x="150"
    y="96"
    width="1300"
    height="328"
    rx="34"
    fill="url(#panel)"
    stroke="#504f4b"
    stroke-width="2"
    filter="url(#shadow)"
  />
  <rect x="150" y="96" width="9" height="328" rx="4.5" fill="url(#accent)" />

  <text
    x="280"
    y="286"
    fill="#ffffff"
    font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif"
    font-size="138"
    letter-spacing="0"
    text-anchor="middle"
    dominant-baseline="central"
  >
    🕊️
  </text>

  <text
    x="430"
    y="202"
    fill="#f7f7f7"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="62"
    font-weight="700"
    letter-spacing="0"
  >
    CodexPigeon
  </text>
  <text
    x="430"
    y="263"
    fill="#dedede"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="29"
    font-weight="650"
    letter-spacing="0"
  >
    Non-interrupting mailbox companion for Codex worktrees
  </text>
  <text
    x="430"
    y="330"
    fill="#ffd2ad"
    font-family="'SFMono-Regular', Menlo, Consolas, monospace"
    font-size="24"
    font-weight="700"
    letter-spacing="0"
  >
    mailbox-only
  </text>
  <circle cx="637" cy="321" r="5.5" fill="#ffd2ad" />
  <text
    x="676"
    y="330"
    fill="#ffd2ad"
    font-family="'SFMono-Regular', Menlo, Consolas, monospace"
    font-size="24"
    font-weight="700"
    letter-spacing="0"
  >
    safe checkpoints
  </text>
  <circle cx="932" cy="321" r="5.5" fill="#ffd2ad" />
  <text
    x="971"
    y="330"
    fill="#ffd2ad"
    font-family="'SFMono-Regular', Menlo, Consolas, monospace"
    font-size="24"
    font-weight="700"
    letter-spacing="0"
  >
    macOS + Linux
  </text>
</svg>
